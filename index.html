<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ana Flávia - Mapeamento Alimentar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=Dancing+Script:wght@600;700&family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#F5841A",
              secondary: "#006D7C",
              "accent-peach": "#F2C9A3",
              "accent-green": "#8BA88E",
              "background-light": "#F9F6F0", // Cream
              "background-dark": "#1A1918",
              "card-light": "#FFFBF2",
              beige: "#EBE3D5",
              "soft-blue": "#8ABDD1",
            },
            fontFamily: {
              display: ["Playfair Display", "serif"],
              sans: ["Lato", "sans-serif"],
              script: ["Dancing Script", "cursive"],
              handwriting: ["Sacramento", "cursive"],
            },
            backgroundImage: {
              'grid-pattern': "url(\"data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0V0zm1 1h38v38H1V1z' fill='%23D1CCC0' fill-opacity='0.2' fill-rule='evenodd'/%3E%3C/svg%3E\")",
              'paper-texture': "url('https://www.transparenttextures.com/patterns/natural-paper.png')",
            }
          },
        },
      };
    </script>
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.6s ease-out forwards;
      }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-light text-gray-800 antialiased min-h-screen">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
